name: Telegram Release Notification

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build message from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Same source as the GitHub release and docs/changelog.html. Needs no npm install.
          if ! node scripts/site-gen.mjs notes "${TAG#v}" --telegram > telegram.html; then
            PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
            {
              echo "🔮 <b>Rune ${TAG}</b>"
              echo ""
              git log "${PREV_TAG}..${TAG}" --pretty=format:"• %s" --no-merges | head -15 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
              echo ""
              echo ""
              echo "📦 <a href=\"https://github.com/rune-kit/rune/releases/tag/${TAG}\">GitHub Release</a>"
            } > telegram.html
          fi

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os

          with open('telegram.html', encoding='utf-8') as f:
              text = f.read().strip()[:4000]

          data = json.dumps({
              'chat_id': os.environ['CHAT_ID'],
              'parse_mode': 'HTML',
              'text': text,
              'disable_web_page_preview': True
          }).encode('utf-8')

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          urllib.request.urlopen(req)
          print('Notification sent')
          PYEOF
