<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment validation · Flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · diagram</p>
    <h1>Payment validation</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
      <title id="flowchart-title">Payment validation</title>
      <desc id="flowchart-desc">Flowchart showing a checkout moving from start through a payment validity decision: valid payments capture the charge, invalid payments notify failure, and both paths reach the end.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind boxes) -->
      <line x1="500" y1="88" x2="500" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="556" y1="200" x2="680" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="500" y1="244" x2="500" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="368" x2="500" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 760,224 V 444 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (mask + text, 8px gap off the stroke) -->
      <rect x="508" y="112" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="530" y="122" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBMIT</text>

      <rect x="588" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="190" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="508" y="272" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="508" y="388" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="398" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAILED</text>

      <rect x="648" y="424" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="672" y="434" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUCCESS</text>

      <!-- Node: Start (oval) -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Start</text>

      <!-- Node: Decision (diamond) -->
      <polygon points="500,156 556,200 500,244 444,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Valid payment?</text>

      <!-- Node: Capture charge (happy path, focal) -->
      <rect x="680" y="176" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="176" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="760" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capture charge</text>
      <text x="760" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">charge.card</text>

      <!-- Node: Notify failure (step) -->
      <rect x="420" y="320" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notify failure</text>
      <text x="500" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">email.alert</text>

      <!-- Node: End (oval) -->
      <rect x="420" y="420" width="160" height="48" rx="24" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <text x="500" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">End</text>

      <!-- Legend strip -->
      <line x1="40" y1="496" x2="960" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="516" width="20" height="10" rx="5" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="68" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <polygon points="220,521 228,516 236,521 228,526" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="244" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="340" y="516" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="362" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="430" y="516" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="452" y="524" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>
    </svg>
  </div>
</body>
</html>
